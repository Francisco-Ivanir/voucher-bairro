<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Área do Lojista</title>

  <hr>

<h2>Resumo da Loja</h2>

<p>
Loja:
<strong id="resumoLoja">---</strong>
</p>

<p>
ID do lojista:
<strong id="resumoLojistaId">---</strong>
</p>

<hr>

<p>
Vouchers ativos:
<strong id="vouchersAtivos">0</strong>
</p>

<p>
Vouchers utilizados:
<strong id="vouchersUtilizados">0</strong>
</p>

<p>
Vouchers vencidos:
<strong id="vouchersVencidos">0</strong>
</p>

<hr>

  <h2>Vouchers da Loja</h2>

  <label for="filtroStatus">
  Filtrar por status:
</label>

<select id="filtroStatus">

  <option value="todos">
    Todos
  </option>

  <option value="ativo">
    Ativos
  </option>

  <option value="utilizado">
    Utilizados
  </option>

  <option value="vencido">
    Vencidos
  </option>

</select>
  
<div id="listaVouchers">

  <p>Nenhum voucher carregado.</p>

</div>
  
<link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="card">

<h1>Área do Lojista</h1>

<p>
Validação de Voucher
</p>

<input
  type="text"
  id="codigoVoucher"
  placeholder="Digite o código do voucher"
>

<button id="btnConsultar">
Consultar Voucher
</button>

<div id="resultado">
</div>

</div>


<script type="module" src="js/lojista.js"></script>

</body>

</html>
