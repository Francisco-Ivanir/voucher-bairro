<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administração dos Lojistas</title>

</head>

<body>

  <h1>Administração dos Lojistas</h1>

  <p>
    Área administrativa do Voucher Digital do Bairro.
  </p>

  <hr>

 <h2>Lojistas</h2>

<p>
  Aqui será feita a administração das lojas.
</p>

<button id="btnNovoLojista">
  Cadastrar novo lojista
</button>

  <div id="areaCadastroLojista" style="display: none;">

  <hr>

  <h2>Novo Lojista</h2>

  <p>
    Nome da loja:
  </p>

  <input
    type="text"
    id="nomeNovoLojista"
    placeholder="Nome da loja"
  >

  <p>
    E-mail:
  </p>

  <input
    type="email"
    id="emailNovoLojista"
    placeholder="E-mail do lojista"
  >

  <p>
    Senha:
  </p>

  <input
    type="password"
    id="senhaNovoLojista"
    placeholder="Senha"
  >

  <br><br>

  <button id="btnSalvarLojista">
    Criar lojista
  </button>

  <div id="mensagemCadastroLojista"></div>

</div>
  
  <div id="listaLojistas">
  Carregando lojistas...
</div>

<script
  type="module"
  src="js/admin-lojistas.js">
</script>
  
</body>

</html>
